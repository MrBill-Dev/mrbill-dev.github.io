  <script>
  /* ?? 閰Ｗ?銵典閮剖? ??????????????????????????????????? */
  (function () {
    function adminBase() {
      return ((window.MRBILL_ADMIN || {}).apiBase || "").replace(/\/+$/, "");
    }
    function adminToken() {
      var sess = window.MRBILL_ADMIN_SESSION;
      if (sess) { var t = sess.getToken(); if (t) return t; }
      return (window.MRBILL_ADMIN || {}).apiToken || "";
    }
    function adminFetch(path, opts) {
      opts = opts || {};
      var headers = { Accept: "application/json", Authorization: "Bearer " + adminToken() };
      if (opts.body) headers["Content-Type"] = "application/json";
      return fetch(adminBase() + path, {
        method: opts.method || "GET",
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      }).then(function (r) { return r.json(); });
    }
    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    var elEnabled  = document.getElementById("contactFormEnabled");
    var elEmail    = document.getElementById("contactToEmail");
    var elSave     = document.getElementById("contact-settings-save");
    var elLoadBtn  = document.getElementById("contact-submissions-load");
    var elPanel    = document.getElementById("contact-submissions-panel");
    var elList     = document.getElementById("contact-submissions-list");
    var elModal    = document.getElementById("contact-detail-modal");
    var elModalBody = document.getElementById("contact-detail-body");
    var elModalClose = document.getElementById("contact-detail-close");
    var elModalBackdrop = document.getElementById("contact-detail-backdrop");
    var elModalMailto = document.getElementById("contact-detail-mailto");
    var elModalDelete = document.getElementById("contact-detail-delete");
    var cachedSubs = [];
    var activeSubId = 0;

    function loadContactSettings() {
      adminFetch("/api/admin/settings/contact").then(function (json) {
        if (json.success && json.data) {
          if (elEnabled) elEnabled.checked = json.data.enabled !== false;
          if (elEmail)   elEmail.value     = json.data.toEmail || "";
        }
      }).catch(function () {});
    }

    /* load settings when admin app becomes visible */
    var adminApp = document.getElementById("admin-app");
    if (adminApp) {
      new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (!mutations[i].target.classList.contains("hidden")) {
            loadContactSettings();
            break;
          }
        }
      }).observe(adminApp, { attributes: true, attributeFilter: ["class"] });
    }

    if (elSave) {
      elSave.addEventListener("click", function () {
        var origText = elSave.textContent;
        elSave.disabled = true;
        adminFetch("/api/admin/settings/contact", {
          method: "PUT",
          body: {
            enabled: !!(elEnabled && elEnabled.checked),
            toEmail: elEmail ? elEmail.value.trim() : ""
          }
        }).then(function (json) {
          if (json.success) {
            elSave.textContent = "撌脣摮???;
            setTimeout(function () { elSave.textContent = origText; }, 2000);
          } else {
            alert(json.message || "?脣?憭望?");
          }
        }).catch(function (e) {
          alert(e.message || "?脣?憭望?");
        }).finally(function () {
          elSave.disabled = false;
        });
      });
    }

    if (elLoadBtn) {
      elLoadBtn.addEventListener("click", function () {
        var origText = elLoadBtn.textContent;
        elLoadBtn.disabled = true;
        elLoadBtn.textContent = "頛銝凌?;
        adminFetch("/api/admin/contact-submissions").then(function (json) {
          if (!json.success) throw new Error(json.message || "霈?仃??);
          renderSubs((json.data && json.data.submissions) || []);
          if (elPanel) elPanel.classList.remove("hidden");
        }).catch(function (e) {
          if (elPanel) elPanel.classList.remove("hidden");
          if (elList)  elList.innerHTML =
            '<p class="text-sm text-rose-600">' + esc(e.message || "霈?仃??) + '</p>';
        }).finally(function () {
          elLoadBtn.disabled = false;
          elLoadBtn.textContent = "?頛";
        });
      });
    }

    function renderSubs(subs) {
      cachedSubs = subs || [];
      if (!elList) return;
      if (!cachedSubs.length) {
        elList.innerHTML = '<p class="text-sm text-slate-500">?桀?撠?嗡辣閮???/p>';
        return;
      }
      elList.innerHTML = cachedSubs.map(function (s) {
        var ts = (s.created_at || "").slice(0, 16).replace("T", " ");
        var preview = (s.goal || "").replace(/\s+/g, " ").slice(0, 48);
        return '<button type="button" class="contact-sub-row w-full text-left" data-contact-id="' + esc(String(s.id)) + '" style="border:1px solid #e2e8f0;border-radius:.75rem;padding:.75rem 1rem;background:#fff;font-size:.875rem;cursor:pointer;">' +
          '<div class="flex justify-between items-start gap-2">' +
          '<b class="text-slate-800">' + esc(s.name) + (s.brand ? '嚗? + esc(s.brand) + '嚗? : '') + '</b>' +
          '<span class="text-slate-400 text-xs shrink-0">' + esc(ts) + '</span>' +
          '</div>' +
          '<p class="mt-1 text-slate-600">' + esc(s.service) + (s.budget ? ' 繚 ' + esc(s.budget) : '') + '</p>' +
          '<p class="mt-1 text-slate-500 text-xs truncate">' + esc(preview) + (preview.length >= 48 ? '?? : '') + '</p>' +
          '</button>';
      }).join("");
      Array.prototype.slice.call(elList.querySelectorAll(".contact-sub-row")).forEach(function (btn) {
        btn.addEventListener("click", function () {
          openSubModal(Number(btn.getAttribute("data-contact-id")));
        });
      });
    }

    function findSub(id) {
      for (var i = 0; i < cachedSubs.length; i++) {
        if (Number(cachedSubs[i].id) === id) return cachedSubs[i];
      }
      return null;
    }

    function openSubModal(id) {
      var s = findSub(id);
      if (!s || !elModal || !elModalBody) return;
      activeSubId = id;
      var ts = (s.created_at || "").slice(0, 16).replace("T", " ");
      elModalBody.innerHTML =
        '<p><b>??嚗?/b>' + esc(ts) + '</p>' +
        '<p><b>憪?嚗?/b>' + esc(s.name) + (s.brand ? '嚗? + esc(s.brand) + '嚗? : '') + '</p>' +
        '<p><b>Email嚗?/b><a href="mailto:' + esc(s.email) + '" class="text-blue-600">' + esc(s.email) + '</a>' +
        (s.contact ? ' 繚 ' + esc(s.contact) : '') + '</p>' +
        '<p><b>?寞?嚗?/b>' + esc(s.service) + (s.budget ? ' 繚 ' + esc(s.budget) : '') + '</p>' +
        '<p><b>?格?嚗?/b><span class="whitespace-pre-wrap">' + esc(s.goal) + '</span></p>' +
        (s.message ? '<p><b>鋆?嚗?/b><span class="whitespace-pre-wrap">' + esc(s.message) + '</span></p>' : '') +
        (s.page_url ? '<p class="text-xs text-slate-400 break-all">' + esc(s.page_url) + '</p>' : '');
      if (elModalMailto) {
        var subject = encodeURIComponent("Re: 蝬脩?閮剛???閰Ｗ? ??" + (s.brand || s.name || ""));
        elModalMailto.href = "mailto:" + encodeURIComponent(s.email || "") + "?subject=" + subject;
      }
      elModal.classList.remove("hidden");
    }

    function closeSubModal() {
      if (elModal) elModal.classList.add("hidden");
      activeSubId = 0;
    }

    if (elModalClose) elModalClose.addEventListener("click", closeSubModal);
    if (elModalBackdrop) elModalBackdrop.addEventListener("click", closeSubModal);

    if (elModalDelete) {
      elModalDelete.addEventListener("click", function () {
        if (!activeSubId) return;
        if (!confirm("蝣箏??芷甇斤?閰Ｗ?閮?嚗?文??⊥?敺拙???)) return;
        elModalDelete.disabled = true;
        adminFetch("/api/admin/contact-submissions/" + activeSubId, { method: "DELETE" })
          .then(function (json) {
            if (!json.success) throw new Error(json.message || "?芷憭望?");
            closeSubModal();
            return adminFetch("/api/admin/contact-submissions");
          })
          .then(function (json) {
            if (!json.success) throw new Error(json.message || "霈?仃??);
            renderSubs((json.data && json.data.submissions) || []);
          })
          .catch(function (e) {
            alert(e.message || "?芷憭望?");
          })
          .finally(function () {
            elModalDelete.disabled = false;
          });
      });
    }
  })();
  </script>
