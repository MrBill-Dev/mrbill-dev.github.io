<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search || "");
        var slug = q.get("slug");
        if (!slug || q.get("preview") === "1") return;
        fetch(slug + "/index.html", { method: "HEAD", cache: "no-store" })
          .then(function (res) {
            if (res.ok) {
              location.replace(slug + "/");
              return;
            }
            return fetch(slug + ".html", { method: "HEAD", cache: "no-store" });
          })
          .then(function (res) {
            if (res && res.ok) location.replace(slug + ".html");
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
  <title>Loading...</title>

  </script>

    .blog-pre { white-space: pre-wrap; word-break: break-word; }
    .blog-preview-banner {
      background: #fef3c7; border-bottom: 1px solid #fcd34d;
      color: #92400e; font-size: 13px; font-weight: 700;
      text-align: center; padding: 10px 16px;
      display: none;
    }
    .blog-preview-banner.is-visible { display: block; }
    #blog-dynamic-loading { display: none; }
    html[data-blog-dynamic-loading="1"] #blog-dynamic-loading { display: block; }
  </style>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search || "");
        if (q.get("slug")) {
          document.documentElement.setAttribute("data-blog-dynamic-loading", "1");
        }
      } catch (e) {}
    })();
  </script>
