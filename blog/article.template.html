<!DOCTYPE html>
<!--
  新文章步驟（靜態站、每篇一檔）：
  1. 複製本檔為 blog/{YYYY-MM-DD}-{主題}.html
  2. 在 js/blog-articles.js 的 BLOG_ARTICLES 加一筆（slug、title、category、tags…）
  3. 右欄：<aside class="blog-rail blog-rail--right"><div id="blog-article-rail"></div></aside>
     並載入 blog-articles.js，DOMContentLoaded 呼叫 renderBlogArticleRail('blog-article-rail')
  4. 列表／學程頁共用 BLOG_ARTICLES，無需重複維護連結

  文章很多（約 30+）再考慮：blog-layout--with-nav 左側文章選單，或 content/{slug}.json 渲染。
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>文章標題｜MrBill AI Studio</title>
  <meta name="description" content="摘要" />
  <link rel="canonical" href="https://mrbill-dev.github.io/blog/SLUG.html" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="MrBill AI Studio" />
  <meta property="og:title" content="文章標題" />
  <meta property="og:description" content="摘要" />
  <meta property="og:url" content="https://mrbill-dev.github.io/blog/SLUG.html" />
  <meta property="og:image" content="https://mrbill-dev.github.io/assets/OG檔名.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://mrbill-dev.github.io/assets/OG檔名.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/components-loader.js"></script>
  <!-- Hero meta：busuanzi 區塊（#busuanzi_container_page_pv / #busuanzi_value_page_pv）；文末 blog-stats.js -->
  <link rel="stylesheet" href="../css/blog-layout.css" />
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col">
  <header id="global-header"></header>
  <main class="flex-grow w-full min-w-0">
    <!-- Hero 用 .blog-hero（見 blog-layout.css）；內文區見 2026-05-31-ai-prompt-six-levels.html -->
  </main>
  <footer id="global-footer"></footer>
  <script>
    function fixNavPathsFromSubdir() { /* 同 2026-05-31-ai-prompt-six-levels.html */ }
    window.addEventListener('DOMContentLoaded', function() {
      includeComponentSlot('global-header', '../components/header.html', null, fixNavPathsFromSubdir);
      includeComponentSlot('global-footer', '../components/footer.html', null, fixNavPathsFromSubdir);
    });
  </script>
</body>
</html>
