  <footer id="global-footer" class="bg-white border-t border-slate-100 py-8 px-4 sm:px-6 mt-auto overflow-x-hidden"></footer>

  <script>
    function fixNavPathsFromSubdir() {
      var header = document.getElementById("global-header");
      var footer = document.getElementById("global-footer");
      [header, footer].forEach(function (root) {
        if (!root) return;
        root.querySelectorAll("a[href]").forEach(function (a) {
          var h = a.getAttribute("href");
          if (!h || /^https?:\/\//.test(h) || h.startsWith("#") || h.startsWith("../") || h.startsWith("/")) return;
          if (h.startsWith("./")) a.setAttribute("href", ".." + h.slice(1));
          else a.setAttribute("href", "../" + h);
        });
      });
    }
    window.addEventListener("DOMContentLoaded", function () {
      includeComponentSlot("global-header", "../components/header.html", null, fixNavPathsFromSubdir);
      includeComponentSlot("global-footer", "../components/footer.html", null, fixNavPathsFromSubdir);
      initBlogArticlePage();
    });
  </script>
</body>
