<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>文章分享｜MrBill AI Studio</title>
  <meta name="description" content="一個來自多年累積的內容空間，分享實務經驗與長期整理的思考。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/components-loader.js"></script>
  <script src="../js/blog-articles.js"></script>
  <link rel="stylesheet" href="../css/blog-layout.css" />
  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans TC", sans-serif; }
    .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased min-h-screen flex flex-col text-base overflow-x-hidden">
  <header id="global-header" class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100"></header>

  <main class="flex-grow w-full min-w-0 fade-in-up">
    <section class="blog-hero w-full text-white">
      <div class="blog-hero__media" aria-hidden="true">
        <img src="../assets/blog-2026-05-31-ai-prompt-og.jpg" alt="" class="blog-hero__img" loading="lazy" />
      </div>
      <div class="blog-hero__panel">
        <div class="blog-shell blog-hero__inner">
          <a href="../index.html" class="blog-hero__back md:hidden">← 首頁</a>
          <nav class="blog-hero__breadcrumb hidden md:block" aria-label="麵包屑">
            <ol>
              <li><a href="../index.html">首頁</a></li>
              <li aria-hidden="true">/</li>
              <li><span class="text-white font-medium">文章分享</span></li>
            </ol>
          </nav>
          <div class="blog-hero__tags">
            <span class="blog-hero__tag">文章分享</span>
          </div>
          <h1 class="blog-hero__title">文章分享</h1>
          <p class="blog-hero__subtitle">一個來自多年累積的內容空間，分享實務經驗與長期整理的思考。</p>
        </div>
      </div>
    </section>

    <div class="blog-shell px-4 lg:px-8 py-10 md:py-14">
      <div id="blog-article-list" class="grid gap-4 max-w-4xl"></div>
      <p class="mt-8 text-center text-sm text-slate-500">
        <a href="../ai-learning-map.html" class="font-bold text-indigo-600 no-underline hover:text-indigo-800">← AI 學習地圖（系統化學程）</a>
      </p>
    </div>
  </main>

  <footer id="global-footer" class="bg-white border-t border-slate-100 py-8 px-4 sm:px-6 mt-auto overflow-x-hidden"></footer>

  <script>
    function fixNavPathsFromSubdir() {
      var header = document.getElementById("global-header");
      var footer = document.getElementById("global-footer");
      [header, footer].forEach(function (root) {
        if (!root) return;
        root.querySelectorAll("a[href]").forEach(function (a) {
          var h = a.getAttribute("href");
          if (!h || /^https?:\/\//.test(h) || h.startsWith("#") || h.startsWith("../") || h.startsWith("/")) return;
          if (h.startsWith("./")) a.setAttribute("href", ".." + h.slice(1));
          else a.setAttribute("href", "../" + h);
        });
      });
    }
    window.addEventListener("DOMContentLoaded", function () {
      includeComponentSlot("global-header", "../components/header.html", null, fixNavPathsFromSubdir);
      includeComponentSlot("global-footer", "../components/footer.html", null, fixNavPathsFromSubdir);
      renderBlogArticleList("blog-article-list");
    });
  </script>
</body>
</html>
